<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#17201c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Chaturthi and Chulanghan Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Mukta:wght@400;600;800&display=swap">
<style>
/* Layout: phone-first app shell — sticky header with language switch, one scrolling view, fixed bottom tab bar, slide-up order sheet */
:root{
  --bg:#fffaf0; --surface:#ffffff; --sunk:#f7efdc; --ink:#1c2a20; --muted:#6a6352; --line:#eadfc6;
  --accent:#f59e0b; --accent-ink:#2b1700; --accent-soft:#fdeccb;
  --brand:#14532d; --brand-ink:#ffffff; --brand-soft:#dcefe2; --brand-text:#14532d;
  --cash:#257a4a; --cash-soft:#ddf1e5; --online:#2f5fbf; --online-soft:#e0e9fb; --paytm:#0a76ad; --paytm-soft:#dcf0fa; --phonepe:#5f37a8; --phonepe-soft:#ece4f8; --warn:#b93d12; --warn-soft:#fbe4da;
  --ice:#b0306a; --ice-soft:#fbe1ee; --water:#1d7f96; --water-soft:#dbf1f6; --cold:#7a4bc2; --cold-soft:#ece3fa;
  --veg:#1e8a3c; --nonveg:#a5301a;
  --f-display:"Bricolage Grotesque","Mukta",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree","Mukta",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1712; --surface:#15231a; --sunk:#0b130e; --ink:#eef3ee; --muted:#9fb3a5; --line:#24382b;
  --accent:#fbbf24; --accent-ink:#1d1300; --accent-soft:#3b2d0c;
  --brand:#0f3d22; --brand-ink:#ffffff; --brand-soft:#173826; --brand-text:#7fd6a0;
  --cash:#5fc48c; --cash-soft:#18301f; --online:#86a8f0; --online-soft:#1b2640; --paytm:#5cc0ea; --paytm-soft:#12303d; --phonepe:#b79af0; --phonepe-soft:#291e3f; --warn:#f08a5d; --warn-soft:#3a1d12;
  --ice:#f07fb2; --ice-soft:#3a1828; --water:#6fcbe0; --water-soft:#12303a; --cold:#b896f0; --cold-soft:#2a1f40;
  --veg:#4cc06e; --nonveg:#ec7a5f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1712; --surface:#15231a; --sunk:#0b130e; --ink:#eef3ee; --muted:#9fb3a5; --line:#24382b;
  --accent:#fbbf24; --accent-ink:#1d1300; --accent-soft:#3b2d0c;
  --brand:#0f3d22; --brand-ink:#ffffff; --brand-soft:#173826; --brand-text:#7fd6a0;
  --cash:#5fc48c; --cash-soft:#18301f; --online:#86a8f0; --online-soft:#1b2640; --paytm:#5cc0ea; --paytm-soft:#12303d; --phonepe:#b79af0; --phonepe-soft:#291e3f; --warn:#f08a5d; --warn-soft:#3a1d12;
  --ice:#f07fb2; --ice-soft:#3a1828; --water:#6fcbe0; --water-soft:#12303a; --cold:#b896f0; --cold-soft:#2a1f40;
  --veg:#4cc06e; --nonveg:#ec7a5f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--accent)}
.top h1{font-size:17px;font-weight:800;line-height:1.15}
.top .sub{color:rgb(255 255 255 / .78);font-size:12.5px}
.top .tools{display:flex;gap:6px;align-items:center;flex:none}
.themebtn{border:1px solid rgb(255 255 255 / .35);background:rgb(255 255 255 / .1);color:#fff;border-radius:999px;width:32px;height:30px;display:grid;place-items:center;font-size:15px;padding:0}
.top .who{min-width:0}
.lang{display:inline-flex;border:1px solid rgb(255 255 255 / .35);border-radius:999px;overflow:hidden;flex:none;background:rgb(255 255 255 / .1)}
.lang button{border:0;background:none;padding:5px 9px;font-size:12px;font-weight:700;color:rgb(255 255 255 / .85)}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
main{padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-text);font-weight:800}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:600;overflow-wrap:anywhere}
.li .meta{font-size:12.5px;color:var(--muted)}
button.li{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.list button.li:first-child{border-top:0}
.amt{font-weight:700;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.4}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;max-width:100%}
.segtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.segtabs button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.segtabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.cash{background:var(--cash-soft);color:var(--cash)}
.pill.online{background:var(--online-soft);color:var(--online)}
.pill.paytm{background:var(--paytm-soft);color:var(--paytm)}
.pill.phonepe{background:var(--phonepe-soft);color:var(--phonepe)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.icecream{background:var(--ice-soft);color:var(--ice)}
.pill.snack,.pill.other{background:var(--sunk);color:var(--ink)}
.pill.water{background:var(--water-soft);color:var(--water)}
.pill.cold{background:var(--cold-soft);color:var(--cold)}
.vm{display:inline-block;width:13px;height:13px;border:1.6px solid currentColor;border-radius:2px;position:relative;flex:none;vertical-align:-2px}
.vm::after{content:"";position:absolute;inset:2.2px;border-radius:50%;background:currentColor}
.vm.veg{color:var(--veg)}
.vm.nonveg{color:var(--nonveg)}
.vm.nonveg::after{border-radius:0;inset:2px 1.6px 2.4px;clip-path:polygon(50% 0,100% 100%,0 100%)}
:where(input[type=text],input[type=number],input[type=search],input[type=tel],select){width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 11px;min-height:40px}
input.qty{flex:none}
input.nameinp{flex:1;min-width:0;width:auto;background:transparent;border-color:transparent;font-weight:600;padding:7px 8px;margin-left:-6px}
input.nameinp:hover{border-color:var(--line)}
input.nameinp:focus{background:var(--sunk);border-color:var(--accent)}
input:disabled{opacity:.6}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{font-size:13px;color:var(--muted);align-self:center}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.note{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
details>summary{cursor:pointer;color:var(--muted);font-weight:600}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tbl{aspect-ratio:1/1;max-width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.tbl .n{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.tbl .t{font-size:11.5px;color:var(--muted);text-align:center}
.tbl.busy{background:var(--accent-soft);border-color:var(--accent)}
.tbl.busy .t{color:var(--accent);font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}

/* sales */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.big{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em}
.paybar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.paybar i{display:block;height:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:12px;padding:10px 12px;display:grid;gap:2px;align-content:start;background:var(--sunk);min-width:0}
.stat.cash{background:var(--cash-soft)} .stat.online{background:var(--online-soft)} .stat.warn{background:var(--warn-soft)}
.stat .v{font-weight:800;font-size:20px}
.stat.cash .v{color:var(--cash)} .stat.online .v{color:var(--online)} .stat.warn .v{color:var(--warn)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.ledger .tot{font-weight:800;border-top:1px solid var(--line);padding-top:6px}
.ledger span{display:flex;align-items:center;gap:6px}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .d{font-weight:700;min-width:120px;text-align:center}

/* stock + counter */
.qty{width:72px;text-align:center;font-weight:700}
.prod{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.prod:first-child{border-top:0}
.prod .name{font-weight:700;overflow-wrap:anywhere}
.prod .meta{font-size:12.5px;color:var(--muted)}
.prod .stk{display:grid;justify-items:end;gap:2px}
.prod .stk input{width:78px;text-align:center;font-weight:800;font-size:18px;min-height:38px;padding:4px}
.prod .stk input.neg{color:var(--warn);border-color:var(--warn)}
.prod .acts{grid-column:1/-1;display:flex;gap:8px}
.prod .acts .btn{flex:1}

/* credit */
.crow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow.late{background:linear-gradient(90deg,var(--warn-soft),transparent 70%)}
.crow .name{font-weight:700;overflow-wrap:anywhere}
.crow .meta{font-size:12.5px;color:var(--muted)}
.crow .big2{font-weight:800;font-size:18px;text-align:right;white-space:nowrap}
.crow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.phone{user-select:all;font-weight:600;color:var(--ink)}

/* attendance + salary */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:8px 10px;font-weight:700;font-size:13px;min-width:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.P{background:var(--cash);color:var(--surface)}
.seg button.on.H{background:var(--accent);color:var(--accent-ink)}
.seg button.on.A{background:var(--warn);color:var(--surface)}
.runbox{grid-column:1/-1;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);display:grid;gap:4px;font-size:13.5px}.runbox .ln{display:flex;justify-content:space-between;gap:8px}
.sal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.sal:first-child{border-top:0}
.sal .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);grid-column:1/-1}
.sal .meta{font-size:12.5px;color:var(--muted)}
.sal .ln span:last-child{white-space:nowrap}
.sal .ln.tot{color:var(--ink);font-weight:800;font-size:15px;border-top:1px dashed var(--line);padding-top:4px}

.tcard{display:grid;gap:0}
.tcard.off{opacity:.75}
.tcard input.nm{font-weight:700;font-size:16px}
.seg button.on.H{background:var(--accent);color:var(--accent-ink)}
:where(input[type=time],input[type=date]){width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 11px;min-height:40px}
.discbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.discbox input{width:110px;flex:none;text-align:right;font-weight:700}
.seg button.on.dk{background:var(--ink);color:var(--bg)}
.mtable{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px 12px;font-size:13.5px;align-items:baseline}
.mtable .hd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:right}
.mtable .num{text-align:right;white-space:nowrap}
.mtable .out{color:var(--warn)}
.mtable .tot{font-weight:800;border-top:1px solid var(--line);padding-top:7px}
.profit .big2{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--cash);line-height:1.1}
.profit.neg .big2{color:var(--warn)}
.profit .spread{align-items:flex-start}
.profit .ledger{min-width:170px}
.tm{font-size:12px;color:var(--muted);font-weight:700;min-width:58px;flex:none}
.amt.out{color:var(--warn)} .amt.in{color:var(--cash)}
.datepick{width:auto!important;min-width:150px;font-weight:700;text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{color:var(--cash)!important} .down{color:var(--warn)!important}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;overflow-x:auto;padding-top:6px}
.bcol{flex:1 0 14px;display:flex;flex-direction:column;align-items:stretch;gap:4px;height:100%;min-width:14px}
.bcol span{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.bpair{flex:1;display:flex;align-items:flex-end;gap:1px}
.bpair i{flex:1;display:block;border-radius:3px 3px 0 0;min-height:1px}
.bpair .bp{background:var(--line)} .bpair .bc{background:var(--accent)}
.bcol.hi .bc{background:var(--cash)} .bcol.lo .bc{background:var(--warn)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.cmp th{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;white-space:normal}
table.cmp tr.hi td:first-child{box-shadow:inset 3px 0 var(--cash)} table.cmp tr.lo td:first-child{box-shadow:inset 3px 0 var(--warn)}
.pair2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ln2{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-top:1px solid var(--line)}
.ln2:first-of-type{border-top:0}
.bill .ln.ed{align-items:center;grid-template-columns:minmax(0,1fr) auto auto}
.bill .ln.ed small{font-size:11.5px}
.bill .ln.ed .amt{min-width:58px;text-align:right}
.bill .addmore{justify-self:start;color:var(--accent);padding-inline:0}
.danger-zone{border-color:var(--warn-soft)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px;min-width:0;overflow:hidden;white-space:nowrap;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand-text)}
nav.tabs button.on::before{content:'';position:absolute;top:-6px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs button.on svg{stroke:var(--accent)}
nav.tabs .nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--warn);color:var(--surface);font-size:10px;font-weight:800;border-radius:999px;padding:0 5px;line-height:16px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:20px;font-weight:800;flex:1;min-width:0}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
.sheet-foot{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px}
.sheet-foot .tot{flex:1;font-family:var(--f-display);font-weight:800;font-size:22px;min-width:0}
.stepper{display:flex;align-items:center;gap:4px;flex:none;background:var(--accent-soft);border-radius:11px;padding:2px}
.stepper span{min-width:24px;text-align:center;font-weight:800;color:var(--accent)}
.stepper .icon-btn{width:34px;height:34px;border:0;background:var(--surface)}
.col{display:flex;flex-direction:column;gap:12px}
.sticky{position:sticky;top:-14px;z-index:2;background:var(--bg);margin:-2px -16px 0;padding:8px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.searchbox{display:flex;gap:6px;align-items:center}
.searchbox input{flex:1}
.grp{margin:4px 2px 6px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-top:1px solid var(--line);min-width:0}
.mrow:first-child{border-top:0}
.mrow.in{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.mrow .grow{flex:1;min-width:0;cursor:pointer}
.mrow .name{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.mrow .meta{font-size:12.5px;color:var(--muted)}
.addbtn{min-width:64px;color:var(--accent);border-color:var(--accent);font-weight:800}
.vsp{width:13px;flex:none}

/* a fresh read right before the write keeps two phones from overwriting each other's numbers */
async function bump(path,field,delta){
  const ref=db.doc(path);if(ref.txBump)return ref.txBump(field,delta);const s=await ref.get();if(!s.exists)return null;
  const v=+((+s.data()[field]||0)+delta).toFixed(3);await ref.update({[field]:v,updatedAt:Date.now()});return {v,data:s.data()};
}

/* ---------- money: one place that adds up every rupee in and out ---------- */
function moneyFor(src,inR){
  const z=()=>({cash:0,upi:0,paytm:0,phonepe:0});
  const add1=(b,pay,v)=>{v=+v||0;if(pay==='cash')b.cash+=v;else{b.upi+=v;if(pay==='paytm')b.paytm+=v;else if(pay==='phonepe')b.phonepe+=v}};
  const add=(b,pay,v,x)=>{if(pay==='split'&&x&&x.split){for(const k in x.split)add1(b,k,x.split[k])}else add1(b,pay,v)};
  const paid=src.orders.filter(o=>o.status==='paid'&&inR(o.date)),cs=src.csales.filter(x=>inR(x.date));
  const sales=z();
  sales.credit=0;
  paid.forEach(o=>{const p=payParts(o);sales.cash+=p.cash;sales.paytm+=p.paytm;sales.phonepe+=p.phonepe;sales.upi+=p.paytm+p.phonepe+p.other;sales.credit+=p.credit||0});
  cs.forEach(x=>add(sales,x.pay,x.total));
  /* a bill's discount is spread over its dishes so the kitchen figures add up to what was collected */
  let veg=0,non=0,ctr=sum(cs,x=>x.total),ctrCost=sum(cs,x=>x.cost!=null?x.cost:pcCost(x.pid)*x.qty);const ctrBy={};
  const cb=(pid,name,q,v,c)=>{const k=pid||name;const o=ctrBy[k]=ctrBy[k]||{name,qty:0,sales:0,cost:0};o.qty+=q;o.sales+=v;o.cost+=c};
  cs.forEach(x=>cb(x.pid,x.name,x.qty,+x.total||0,x.cost!=null?x.cost:pcCost(x.pid)*x.qty));
  paid.forEach(o=>{const g=orderTotal(o),f=g?(+o.total||0)/g:1;(o.items||[]).forEach(i=>{const v=i.price*i.qty*f;if(i.pid){ctr+=v;const c=(i.cost!=null?i.cost:pcCost(i.pid))*i.qty;ctrCost+=c;cb(i.pid,i.name,i.qty,v,c)}else if(i.k==='nonveg')non+=v;else veg+=v})});
  const exps=src.expenses.filter(e=>inR(e.date)),sals=src.salaries.filter(x=>inR(x.date));
  const advs=src.credits.filter(c=>c.kind==='staff'&&inR(c.date)),given=src.credits.filter(c=>c.kind!=='staff'&&c.source!=='bill'&&c.source!=='food'&&inR(c.date)),back=src.creditPays.filter(c=>inR(c.date));
  const drw=(src.drawer||[]).filter(x=>inR(x.date)),oin=z(),oout=z();
  drw.forEach(x=>{if(x.kind==='in')oin.cash+=+x.amount||0;if(x.kind==='out')oout.cash+=+x.amount||0});
  const exp=z(),sal=z(),adv=z(),giv=z(),bk=z();
  exps.forEach(e=>add(exp,e.pay,e.amount,e));sals.forEach(x=>add(sal,x.pay,x.paid,x));advs.forEach(c=>add(adv,c.pay,c.amount,c));
  given.forEach(c=>add(giv,c.pay,c.amount,c));back.forEach(c=>add(bk,c.pay,c.amount,c));
  const tot=b=>b.cash+b.upi+(b.credit||0);
  const net={cash:sales.cash+bk.cash-exp.cash-sal.cash-adv.cash-giv.cash+oin.cash-oout.cash,upi:sales.upi+bk.upi-exp.upi-sal.upi-adv.upi-giv.upi};
  const refT=sum(paid,o=>sum(o.refunds||[],r=>r.amount));
  return {ctrCost,ctrBy,ctrMargin:ctr-ctrCost,drw,oin,oout,refT,paid,cs,exps,sals,advs,given,back,sales,exp,sal,adv,giv,bk,net,veg,non,ctr,discT:sum(paid,o=>o.discount),tot,
    profit:tot(sales)-tot(exp)-tot(sal)-tot(adv)};
}
const EMPTY_SRC=()=>({orders:[],csales:[],expenses:[],salaries:[],credits:[],creditPays:[],audit:[],drawer:[]});

  if(S.salesMode==='dates'){let a=S.rFrom||S.day,b=S.rTo||S.day;if(a>b)[a,b]=[b,a];if(daysBetween(a,b)>400)b=shift(a,400);return [a,b]}

const recTimers={};

async function recomputeDay(d){
  const src=EMPTY_SRC(),cols=[['orders','orders'],['csales','csales'],['expenses','expenses'],['salaries','salaries'],['credits','credits'],['creditpays','creditPays']];
  for(const [c,k] of cols){const q=await db.collection(c).where('date','==',d).get();src[k]=docs(q)}

async function archiveBefore(cut){
  /* first make sure every day being cleared has its daily summary, so trends keep working */
  const ord=docs(await db.collection('orders').where('date','<',cut).get());
  const dates=[...new Set(ord.map(o=>o.date))];
  let i=0;for(const d of dates){try{await recomputeDay(d)}catch(e){}i++;if(i%10===0)toast(t('archiveStep1',{n:i,t:dates.length}))}
  const plan=[['orders',x=>x.status!=='open'],['csales'],['expenses'],['creditpays'],['restock'],['audit'],['attendance'],['drawer',x=>x.kind!=='count'],['credits',x=>x.status!=='open'],['supbills',x=>x.status!=='open']];
  let n=0;
  for(const [c,keep] of plan){
    const list=docs(await db.collection(c).where('date','<',cut).get()).filter(x=>keep?keep(x):true);
    for(const x of list){try{await db.doc(c+'/'+x.id).delete();n++}catch(e){}if(n%25===0)toast(t('archiveStep2',{n}))}
  }
  audit('archive','storage','archive',today(),t('archiveH'),null,{before:cut,removed:n});
  toast(t('archiveDone',{n}));S.storage=null;render();
}

  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf)}catch(e){toast(t('exportFail'));return}
  const el=stageBill(b,pp);$('#printArea').classList.add('stage');
  let canvas;try{canvas=await html2canvas(el,{scale:3,backgroundColor:'#ffffff'})}finally{$('#printArea').classList.remove('stage')}
  const hmm=P.h||Math.max(60,Math.ceil(canvas.height/canvas.width*P.mm));
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:[P.mm,hmm],orientation:'portrait'});
  pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,P.mm,canvas.height/canvas.width*P.mm);
  const blob=pdf.output('blob'),dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(!dl){toast(t('exportUnavailable'));return}
  const fn=(b.billNo?'Bill '+fmtBill(b.billNo).slice(1):'Bill '+b.name)+' '+new Date(b.at).toISOString().slice(0,10)+'.pdf';
  try{await dl.save({filename:fn,data:blob});toast(t('pdfSaved'))}catch(e){if(e&&e.code!=='declined')toast(t('exportFail'))}
}

/* ---------- Bluetooth receipt printer (ESC/POS over Bluetooth Low Energy) ---------- */
const BT_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb'];
const BT={dev:null,ch:null,busy:false};
const btSupported=()=>!!(navigator.bluetooth&&window.isSecureContext&&window.top===window.self);
const btName=()=>{try{return localStorage.getItem('btName')||''}catch(e){return ''}};
const btReady=()=>!!(BT.ch&&BT.dev&&BT.dev.gatt&&BT.dev.gatt.connected);
async function btFindChar(server){
  const svcs=await server.getPrimaryServices();
  for(const sv of svcs){let chs=[];try{chs=await sv.getCharacteristics()}catch(e){continue}
    for(const c of chs)if(c.properties.writeWithoutResponse||c.properties.write)return c}
  throw new Error('nowrite');
}
async function btAttach(dev){
  BT.dev=dev;dev.addEventListener('gattserverdisconnected',()=>{BT.ch=null;render();renderModal()});
  const server=await dev.gatt.connect();BT.ch=await btFindChar(server);
  try{localStorage.setItem('btName',dev.name||'Printer');localStorage.setItem('btId',dev.id||'')}catch(e){}
}
async function btConnect(){
  if(!btSupported()){toast(t('btNoSupport'));return false}
  try{const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SERVICES});
    toast(t('btConnecting'));await btAttach(dev);toast(t('btConnected',{n:dev.name||'Printer'}));render();renderModal();return true}
  catch(e){if(e&&e.name==='NotFoundError')return false;toast(e&&e.message==='nowrite'?t('btNotPrinter'):t('btFail'));return false}
}
async function btReconnect(){
  if(btReady())return true;
  try{if(BT.dev){const server=await BT.dev.gatt.connect();BT.ch=await btFindChar(server);return true}
    if(navigator.bluetooth&&navigator.bluetooth.getDevices){const id=localStorage.getItem('btId');const list=await navigator.bluetooth.getDevices();const d=list.find(x=>x.id===id)||list[0];if(d){await btAttach(d);return true}}}catch(e){}
  return false;
}
function btDisconnect(){try{BT.dev&&BT.dev.gatt.disconnect()}catch(e){}BT.dev=null;BT.ch=null;try{localStorage.removeItem('btName');localStorage.removeItem('btId')}catch(e){}render();renderModal()}
/* picture of the bill → black-and-white dots → printer commands */
function escposRaster(canvas){
  const w=canvas.width,h=canvas.height,bw=Math.ceil(w/8),ctx=canvas.getContext('2d'),px=ctx.getImageData(0,0,w,h).data;
  const out=[0x1b,0x40];
  for(let y0=0;y0<h;y0+=128){const rows=Math.min(128,h-y0);out.push(0x1d,0x76,0x30,0,bw&255,bw>>8,rows&255,rows>>8);
    for(let y=y0;y<y0+rows;y++)for(let bx=0;bx<bw;bx++){let b=0;for(let k=0;k<8;k++){const x=bx*8+k;if(x<w){const i=(y*w+x)*4,l=px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11;if(px[i+3]>0&&l<150)b|=0x80>>k}}out.push(b)}}
  out.push(0x1b,0x64,4,0x1d,0x56,0x42,0);
  return new Uint8Array(out);
}
async function btSend(bytes){
  const c=BT.ch,n=c.properties.writeWithoutResponse?180:100;
  for(let i=0;i<bytes.length;i+=n){const part=bytes.slice(i,i+n);
    if(c.properties.writeWithoutResponse&&c.writeValueWithoutResponse){await c.writeValueWithoutResponse(part);if((i/n)%8===7)await new Promise(r=>setTimeout(r,25))}
    else await c.writeValue(part)}
}
async function btPrintEl(el,pp){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
  const dots=pp==='58'?384:576;el.style.width=dots+'px';el.style.padding='4px 6px 10px';
  const canvas=await html2canvas(el,{scale:1,backgroundColor:'#ffffff',width:dots,windowWidth:dots});
  await btSend(escposRaster(canvas));
}
async function btPrintBill(b){
  if(BT.busy)return;BT.busy=true;
  try{if(!(await btReconnect())){toast(t('btNotConn'));return}
    const pp=getPaper()==='58'?'58':'80';const el=stageBill(b,pp);$('#printArea').classList.add('stage');
    try{await btPrintEl(el,pp)}finally{$('#printArea').classList.remove('stage')}
    toast(t('btPrinted'))}
  catch(e){toast(t('btFail'))}finally{BT.busy=false}
}

function puFill(i){const m=S.modal,l=m.lines[i],nm=l.name.trim().toLowerCase();if(!nm)return;
  const p=S.products.find(x=>x.name.trim().toLowerCase()===nm&&(!l.brand||(x.brand||'').toLowerCase()===l.brand.trim().toLowerCase()))||S.products.find(x=>x.name.trim().toLowerCase()===nm);

  l.pid=p.id;if(!l.brand)l.brand=p.brand||'';l.veg=prodVk(p);l.type=p.type||l.type;if(!l.perBox&&+p.perBox)l.perBox=p.perBox;if(!l.boxPrice&&+p.boxCost)l.boxPrice=p.boxCost;if(!l.mrp&&+p.price)l.mrp=p.price;
  setTimeout(()=>{const f=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.pl:null;renderModal();if(f){const e=document.querySelector(`[data-pl="${f}"]`);if(e)e.focus()}},0)}
async function puSave(b){
  const m=S.modal,lines=m.lines.filter(l=>l.name.trim());
  if(!lines.length){toast(t('puNeedItem'));return}
  for(const l of lines){if(!lineOk(l))return;l.saved=true}
  const total=Math.round(sum(lines,lineAmt)*100)/100,sup=(m.sup||'').trim(),d=S.day;
  let pp=null;if(m.mode!=='credit'){pp=total>0?mPayOf(total):{pay:m.pay||'cash'};if(!pp)return}
  else if(!sup){toast(t('puNeedSup'));return}
  b.disabled=true;
  const ok=await save(async()=>{
    const pr=await db.collection('purchases').add({supplier:sup,billNo:m.no||'',date:d,at:Date.now(),total,mode:m.mode||'paid',...(pp||{}),lines:lines.map(l=>({name:l.name.trim(),veg:l.veg||'veg',brand:l.brand.trim(),type:l.type,perBox:+l.perBox,boxes:+l.boxes,boxPrice:+l.boxPrice||0,amount:lineAmt(l),mrp:+l.mrp||0}))});
    for(const l of lines){
      const pcs=Math.round((+l.boxes)*(+l.perBox)),cost=r2(lineCost(l)),upd={brand:l.brand.trim(),veg:l.veg==='nonveg'?'nonveg':'veg',type:l.type,perBox:+l.perBox,boxCost:+l.boxPrice||r2(cost*(+l.perBox)),cost,updatedAt:Date.now()};
      if(+l.mrp>0)upd.price=+l.mrp;
      let pid=l.pid&&S.products.find(x=>x.id===l.pid)?l.pid:null;
      if(pid){await db.doc('products/'+pid).update(upd);await adjustStock(pid,pcs)}
      else{const r=await db.collection('products').add({name:l.name.trim(),...upd,price:+l.mrp||0,qty:pcs,low:0,active:true});pid=r.id}
      await db.collection('restock').add({pid,name:l.name.trim(),qty:pcs,cost:lineAmt(l),purchase:pr.id,date:d,at:Date.now(),...(pp||{pay:'credit'})});
    }
    const note=`${t('purchaseShort')}${sup?': '+sup:''}${m.no?' · #'+m.no:''} (${lines.length})`;
    if(m.mode==='credit')await db.collection('supbills').add({name:sup,phone:'',amount:Math.round(total),paid:0,cat:'counter',note,purchase:pr.id,date:d,at:Date.now(),status:'open'});
    else if(total>0)await db.collection('expenses').add({note,amount:total,...pp,cat:'counter',purchase:pr.id,date:d,at:Date.now()});
  },t('puSaved',{a:inr(total)}),[d]);
  if(ok){S.modal=null;renderModal()}else b.disabled=false;
}

/* one shift is 11 AM to 11 PM. A day's mark is P (full), A (absent), {h,from,to} (hours worked), or legacy H (half) */

/* full-time hours come from the shift start and end; older entries without an end time keep their saved hours */
const shiftOf=s=>{if(s&&s.shiftFrom&&s.shiftTo){const h=spanHours(s.shiftFrom,s.shiftTo);if(h>0)return h}return Math.min(24,Math.max(1,+(s&&s.shiftH)||SHIFT_H))};

const hrOutText=(hh,F)=>hh>F?t('hoursOutOT',{h:Math.round(hh*100)/100,x:Math.round((hh-F)*100)/100}):t('hoursOut',{h:Math.round(hh*100)/100,f:F});

/* the salary a person is owed next: this month's pay date, unless it is already paid or came before they joined */
function baseMonth(s){const cur=today().slice(0,7),j=joinDate(s);return (j&&payDateFor(cur,s.payDay)<=j)||paidFor(s.id,cur).length?mShift(cur,1):cur}

  const start=rng&&rng.from?rng.from:dStart,end=rng&&rng.to?rng.to:dEnd,custom=start!==dStart||end!==dEnd;
  const F=shiftOf(s),perDay=s.payType==='day';
  const days=daysBetween(pstart,pd),sal=+s.salary||0;

  const daily=perDay?+s.rate||0:(s.divisor==='actual'?(days?sal/days:0):sal/30),hourly=daily/F;
  const byDate={};S.attMonth.forEach(a=>byDate[a.date]=a.marks||{});
  let ded=0,unmDed=0,absDed=0,shortDed=0,shortH=0,ot=0,otH=0,abs=0,part=0,full=0,unmarked=0,future=0,counted=0;

/* ---------- order sheet ---------- */
const ikey=i=>i.pid?'p:'+i.pid:'m:'+i.mid;
function catalog(){
  return [...S.menu.map(m=>({key:'m:'+m.id,mid:m.id,name:m.name,price:+m.price,cat:m.cat||t('other'),k:m.k||'veg'})),
          ...S.products.map(p=>({key:'p:'+p.id,pid:p.id,vk:prodVk(p),name:prodLabel(p),price:+p.price,cat:t('t_'+p.type)+(p.brand?' · '+p.brand:''),k:'counter',stock:+p.qty||0}))];
}
function openDraft(o,table,label){
  const base={dirty:false,mode:'edit',pay:'cash',cat:'*',kf:'*',q:''};
  S.draft=o?{...base,id:o.id,table:o.table,label:o.label,items:JSON.parse(JSON.stringify(o.items||[])),disc:o.disc||null,createdAt:o.createdAt}
          :{...base,id:null,table,label,items:[],createdAt:Date.now()};
  renderSheet();
}
const itemMark=i=>vm(i.pid?(i.vk||prodVk(S.products.find(p=>p.id===i.pid))):i.k);
const stepper=(key,n)=>`<div class="stepper"><button class="icon-btn" data-act="decItem" data-key="${key}" aria-label="${esc(t('less'))}">−</button><span>${n}</span><button class="icon-btn" data-act="addItem" data-key="${key}" aria-label="${esc(t('more'))}">+</button></div>`;
const popGet=()=>{try{return JSON.parse(localStorage.getItem('pop')||'{}')}catch(e){return {}}};
function popAdd(items){try{const p=popGet();items.forEach(i=>{const k=ikey(i);p[k]=(p[k]||0)+i.qty});localStorage.setItem('pop',JSON.stringify(p))}catch(e){}}
function sheetMenuHTML(d){
  const q=(d.q||'').trim().toLowerCase(),all=catalog();
  const inK=all.filter(x=>d.kf==='*'||x.k===d.kf);
  const shown=q?all.filter(x=>x.name.toLowerCase().includes(q)):inK.filter(x=>d.cat==='*'||x.cat===d.cat);
  if(!shown.length)return `<div class="empty">${t('noMatch')}</div>`;
  const groups=new Map();
  if(!q&&d.cat==='*'){const pc=popGet(),top=all.filter(x=>pc[x.key]&&(d.kf==='*'||x.k===d.kf)).sort((a,b)=>pc[b.key]-pc[a.key]).slice(0,8);if(top.length)groups.set('⭐ '+t('popularH'),top)}
  shown.forEach(x=>{const g=q||d.cat!=='*'?'':x.cat;if(!groups.has(g))groups.set(g,[]);groups.get(g).push(x)});
  let h='';
  groups.forEach((list,g)=>{
    h+=(g?`<div class="label grp">${esc(g)}</div>`:'')+`<div class="list">`+list.map(x=>{
      const inD=d.items.find(i=>ikey(i)===x.key),n=inD?inD.qty:0;
      return `<div class="mrow ${n?'in':''}">${vm(x.pid?x.vk:x.k)}<div class="grow" data-act="addItem" data-key="${x.key}" role="button" tabindex="0"><div class="name">${esc(x.name)}</div><div class="meta">${inr(x.price)}${x.pid?' · '+t('inStock')+': '+x.stock:''}</div></div>${n?stepper(x.key,n):`<button class="btn sm addbtn" data-act="addItem" data-key="${x.key}">${t('add')}</button>`}</div>`}).join('')+`</div>`;
  });
  return h;
}
/* discount on a bill: a rupee amount or a percentage of the food total */
function discAmt(d){const sub=orderTotal(d),x=d.disc;if(!x||!(+x.v>0))return 0;return Math.min(sub,Math.round(x.type==='pct'?sub*Math.min(100,+x.v)/100:+x.v))}
const billTotal=d=>orderTotal(d)-discAmt(d);
/* when a paid bill changes, the difference is collected or returned by a method the staff picks */
const billDiff=d=>Math.round(billTotal(d)-(+d.orig.total||0));
function paidEditPayHTML(d){
  const diff=billDiff(d),p=d.orig.parts;
  return `<div class="splitbox"><div class="label">${t('paidEarlier')}</div><div class="upisplit" style="font-size:14px">${PAYS.filter(k=>p[k]).map(k=>`<span class="${k}">${payLbl(k)} ${inr(p[k])}</span>`).join('')}${p.other?`<span class="muted">UPI ${inr(p.other)}</span>`:''}</div></div>
    <div id="rfBox" class="splitbox" ${diff?'':'hidden'}><div class="label" id="rfLbl">${diff>0?t('collectVia',{a:inr(diff)}):t('refundVia',{a:inr(-diff)})}</div>${payButtons('rfPay',d.rfPay)}<div class="note">${t('refundHint')}</div></div>`;
}
function updateBillNumbers(){const d=S.draft;if(!d||d.mode!=='bill')return;const sub=orderTotal(d),da=discAmt(d),tot=sub-da;
  if(d.paidEdit){const df=billDiff(d),bx=$('#rfBox'),lb=$('#rfLbl');if(bx)bx.hidden=!df;if(lb)lb.textContent=df>0?t('collectVia',{a:inr(df)}):t('refundVia',{a:inr(-df)})}
  const r=$('#bDiscRow');if(r)r.hidden=!da;const a=$('#bDisc');if(a)a.textContent='− '+inr(da)+(d.disc&&d.disc.type==='pct'&&da?` (${+d.disc.v}%)`:'');
  const s1=$('#bSubRow');if(s1)s1.hidden=!da;
  [$('#bTot'),$('#fTot')].forEach(e=>{if(e)e.textContent=inr(tot)});
  const fd=$('#fDiff');if(fd&&d.paidEdit){const df=tot-(+d.orig.total||0);fd.textContent=df>0?t('collectMore',{a:inr(df)}):df<0?t('giveBack',{a:inr(-df)}):t('noChangeAmt');fd.style.color=df>0?'var(--cash)':df<0?'var(--warn)':''}
  updateSplitInfo()}
function splitDiff(d){const sp=d.split||{};return Math.round((billTotal(d)-PAYS.reduce((a,k)=>a+(+sp[k]||0),0))*100)/100}
function updateSplitInfo(){
  const d=S.draft;if(!d||d.mode!=='bill')return;const btn=$('#shSettle'),info=$('#spInfo');
  if(d.pay!=='split'||d.paidEdit){if(btn)btn.disabled=false;return}
  const diff=splitDiff(d);
  if(info){info.textContent=diff===0?t('splitOk'):diff>0?t('leftToEnter',{a:inr(diff)}):t('tooMuch',{a:inr(-diff)});info.className='note '+(diff===0?'ok':'bad')}
  if(btn)btn.disabled=diff!==0;
}
function renderSheet(){
  const sh=$('#sheet'),d=S.draft;

     <div class="sheet-foot" id="shFoot"></div>`;

  }

  $('#shMeta').textContent=d.id?t('since',{t:hm(d.createdAt)}):t('newO');
  if(d.paidEdit&&!$('#shEditBanner')){const n=document.createElement('div');n.id='shEditBanner';n.className='banner';n.style.cssText='background:var(--online-soft);color:var(--online)';n.textContent=t('editingPaid',{b:fmtBill(d.orig.billNo),a:inr(d.orig.total)});$('#shBody').prepend(n)}

  {const n=$('#shBillNo');if(n)n.textContent=t('billNoNext',{b:fmtBill((S.billN||0)+1)})}

    $('#shBill').innerHTML=`<div class="bill"><div class="spread"><b style="font-family:var(--f-display);font-size:16px">${esc(S.config.name||t('myRest'))}</b><span class="muted">${d.paidEdit?'':fmtBill((S.billN||0)+1)+' · '}${esc(orderName(d))}</span></div><div class="note">${new Date().toLocaleString(LOC[LANG],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div>`+
      d.items.map(i=>`<div class="ln ed"><span>${itemMark(i)} ${esc(i.name)}<br><small class="muted">${t('each',{p:inr(i.price)})}</small></span>${stepper(ikey(i),i.qty)}<span class="amt">${inr(i.price*i.qty)}</span></div>`).join('')+

      `<div class="ln" id="bSubRow" ${da?'':'hidden'} style="border-top:1.5px dashed var(--line);padding-top:8px"><span>${t('subtotal')}</span><span></span><span class="amt">${inr(sub)}</span></div>
      <div class="ln" id="bDiscRow" ${da?'':'hidden'} style="color:var(--cash)"><span>${t('discount')}</span><span></span><span class="amt" id="bDisc">− ${inr(da)}</span></div>

async function persistDraft(){

const qtyByKey=list=>{const m={};(list||[]).forEach(i=>{const k=ikey(i);m[k]=m[k]||{name:i.name,q:0};m[k].q+=i.qty});return m};
function itemsDiffText(a,b){const A=qtyByKey(a),B=qtyByKey(b),out=[],inn=[];
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{const d=(B[k]?B[k].q:0)-(A[k]?A[k].q:0),n=(A[k]||B[k]).name;if(d<0)out.push(`${n} × ${-d}`);if(d>0)inn.push(`${n} × ${d}`)});
  return {out:out.join(', '),inn:inn.join(', ')}}
async function savePaidEdit(b){
  const d=S.draft;if(!d.items.length)return;
  b.disabled=true;
  const da=discAmt(d),total=billTotal(d),diff=billDiff(d);
  /* money per method after the change: the original payment, plus what was collected or minus what was returned */
  const parts={cash:+d.orig.parts.cash||0,paytm:(+d.orig.parts.paytm||0)+(+d.orig.parts.other||0),phonepe:+d.orig.parts.phonepe||0};
  if(diff)parts[d.rfPay]=(parts[d.rfPay]||0)+diff;
  const used=PAYS.filter(k=>Math.abs(parts[k])>0.001),pay=used.length===1?used[0]:used.length?'split':d.rfPay;
  const ch=itemsDiffText(d.orig.items,d.items);
  const upd={items:d.items,subtotal:orderTotal(d),discount:da,disc:da?d.disc:null,total,pay,split:pay==='split'?parts:null,editedAt:Date.now()};
  if(diff<0)upd.refunds=[...d.orig.refunds,{amount:-diff,pay:d.rfPay,at:Date.now(),items:ch.out}];
  if(diff>0)upd.extras=[...d.orig.extras,{amount:diff,pay:d.rfPay,at:Date.now(),items:ch.inn}];
  const qtyBy=list=>{const m={};(list||[]).forEach(i=>{if(i.pid)m[i.pid]=(m[i.pid]||0)+i.qty});return m};
  const was=qtyBy(d.orig.items),now=qtyBy(d.items);
  const msg=diff<0?t('refundDone',{a:inr(-diff),m:payLbl(d.rfPay)}):diff>0?t('collectDone',{a:inr(diff),m:payLbl(d.rfPay)}):t('billUpdated',{b:fmtBill(d.orig.billNo),a:inr(total)});
  const ok=await save(async()=>{
    await db.doc('orders/'+d.id).update(upd);
    for(const pid of new Set([...Object.keys(was),...Object.keys(now)])){const df=(now[pid]||0)-(was[pid]||0);if(df)await adjustStock(pid,-df)}
    audit(diff<0?'refund':'edit','bill',d.id,d.orig.date,fmtBill(d.orig.billNo)+' '+orderName(d),
      {total:d.orig.total,items:itemsText(d.orig.items)},{total,items:itemsText(d.items),...(diff?{[diff<0?'refund':'collected']:Math.abs(diff),pay:d.rfPay}:{})});
  },msg,[d.orig.date]);
  if(ok){S.draft=null;render()}else b.disabled=false;
}

  if(e.target.dataset.split&&S.draft&&S.draft.split){S.draft.split[e.target.dataset.split]=e.target.value;updateSplitInfo()}});
document.addEventListener('change',e=>{const x=e.target,d=x.dataset;
  if(d.spd&&S.modal&&S.modal.kind==='pay'){const m=S.modal,a=$('#spAmt');if(a&&+a.value!==m.due)m.amt=a.value;else m.amt=null;const w=$('#spWhy');if(w)m.why=w.value;m[d.spd]=x.value||null;renderModal();return}
  if(d.crk){S.crKind=x.value;const f=x.value==='food',a=$('#crFoodNote'),b=$('#crPayWrap');if(a)a.hidden=!f;if(b)b.hidden=f;return}
  if(d.pl&&S.modal&&S.modal.kind==='purchase'){const [i,f]=d.pl.split(':');const l=S.modal.lines[+i];if(l){l[f]=x.value;if(f==='name'||f==='brand')puFill(+i);else puRefresh()}return}
  if(d.sp){const bx=document.getElementById(x.id+'S_box');if(bx){bx.hidden=x.value!=='split';if(x.value==='split'){const f=document.getElementById(x.id+'S_cash');f&&f.focus()}}return}
  if(x.id==='exCat'||x.id==='spCat'){S.catSel=S.catSel||{};S.catSel[x.id]=x.value;const o=$('#'+x.id+'Other');if(o){o.hidden=x.value!=='other';if(x.value==='other')setTimeout(()=>o.focus(),0)}return}
  if(d.ed==='cat'&&S.modal&&S.modal.kind==='edit'){S.modal.f.cat=x.value;if(x.value!=='other')S.modal.f.catName='';renderModal();if(x.value==='other')setTimeout(()=>{const o=$('#edCatName');o&&o.focus()},0);return}
  if('armo' in d){const b=$('#arSave');if(b)b.disabled=String(x.value)===String(arMonths());x.classList.toggle('dirty',!b.disabled);return}
  if(d.ed&&S.modal&&S.modal.kind==='edit'&&x.tagName==='SELECT'){S.modal.f[d.ed]=x.value;return}
  if((x.id==='pickDay'||x.id==='pickDay2')&&x.value){S.day=clampDay(x.value);if(db)subAtt();x.blur();render();return}
  if((x.id==='rFrom'||x.id==='rTo')&&x.value){S[x.id]=x.value;x.blur();render();return}
  if(isPendField(x)&&!(d.sedit==='payType')){markPend(x);return}
  applyEdit(x)});
/* edits to menu, stock, prices and staff wait for an explicit Save */
const rowOf=x=>{const d=x.dataset;if(d.sedit)return 's:'+d.sid;if(d.mname||d.mid)return 'm:'+(d.mname||d.mid);if(d.pname||d.pcost||d.ppid)return 'p:'+(d.pname||d.pcost||d.ppid);if(d.pid)return 'k:'+d.pid;return ''};
const isPendField=x=>{const d=x.dataset;return !!(d.mid||d.mname||d.pname||d.pcost||d.ppid||d.sedit||(d.pid&&x.id&&x.id.startsWith('ps_')))};
const origVal=x=>x.tagName==='SELECT'?(([...x.options].find(o=>o.defaultSelected)||x.options[0]||{}).value||''):x.defaultValue;
function markPend(x){
  if(String(x.value)===String(origVal(x))){delete S.pend[x.id]}
  else S.pend[x.id]={v:x.value,ds:{...x.dataset},id:x.id,row:rowOf(x),label:pendLabel(x)};
  x.classList.toggle('dirty',!!S.pend[x.id]);updateSaveBar();
}
function pendLabel(x){const d=x.dataset;
  if(d.mname||d.mid){const m=S.menu.find(z=>z.id===(d.mname||d.mid));return m?m.name:''}
  if(d.pname||d.pcost||d.ppid||d.pid){const m=S.products.find(z=>z.id===(d.pname||d.pcost||d.ppid||d.pid));return m?m.name:''}
  if(d.sedit){const m=S.staffAll.find(z=>z.id===d.sid);return m?m.name:''}return ''}
function applyPend(){
  for(const id in S.pend){const el=document.getElementById(id);if(el&&el!==document.activeElement){el.value=S.pend[id].v;el.classList.add('dirty')}}
  updateSaveBar();
}
function updateSaveBar(){
  const rows=new Set(Object.values(S.pend).map(p=>p.row));document.querySelectorAll('.rowsave').forEach(b=>b.disabled=!rows.has(b.dataset.row));
  const n=Object.keys(S.pend).length,bar=$('#saveBar');if(!bar)return;
  document.body.classList.toggle('has-pend',n>0);bar.hidden=!n;
  if(n){const names=[...new Set(Object.values(S.pend).map(p=>p.label).filter(Boolean))];
    bar.innerHTML=`<div class="grow"><b>${t('unsavedN',{n})}</b><div class="meta">${esc(names.slice(0,3).join(', '))}${names.length>3?' …':''}</div></div><button class="btn ghost" data-act="pendUndo">${t('undoChanges')}</button><button class="btn primary" data-act="pendSave">${t('save')}</button>`}
}
function commitPend(list){
  const staff={};list.forEach(p=>{if(p.ds.sedit)(staff[p.ds.sid]=staff[p.ds.sid]||{})[p.ds.sedit]=p.v;else applyEdit({value:p.v,dataset:p.ds,id:p.id})});
  for(const sid in staff)saveStaffEdits(sid,staff[sid]);
  list.forEach(p=>{const el=document.getElementById(p.id);if(el)el.classList.remove('dirty')});
}
function saveStaffEdits(sid,ch){const st=S.staffAll.find(z=>z.id===sid);if(!st)return;const upd={};
  if('name' in ch){const v=ch.name.trim();if(!v){toast(t('needName'));return}upd.name=v}
  if('role' in ch)upd.role=ch.role.trim();
  if('salary' in ch)upd.salary=Math.max(0,Math.round(+ch.salary||0));
  if('rate' in ch)upd.rate=Math.max(0,Math.round(+ch.rate||0));
  if('payDay' in ch)upd.payDay=Math.min(31,Math.max(1,Math.round(+ch.payDay||1)));
  if('divisor' in ch)upd.divisor=ch.divisor;
  if('shiftFrom' in ch||'shiftTo' in ch){const f=ch.shiftFrom||startOf(st),e=ch.shiftTo||endOf(st),hh=spanHours(f,e);if(!(hh>0)){toast(t('needHours'));return}upd.shiftFrom=f;upd.shiftTo=e;upd.shiftH=hh}
  save(()=>db.doc('staff/'+sid).update(upd),t('savedName',{n:upd.name||st.name}))}
function applyEdit(x){const d=x.dataset;
  if(d.mid){const v=+x.value;if(v>=0)save(()=>db.doc('menu/'+d.mid).update({price:v}),t('priceUpd'))}
  if(d.mname){const v=x.value.trim();const m=S.menu.find(z=>z.id===d.mname);if(!v){x.value=m?m.name:'';toast(t('needName'));return}if(m&&v!==m.name)save(()=>db.doc('menu/'+d.mname).update({name:v}),t('nameUpd'))}
  if(d.pname){const v=x.value.trim();const m=S.products.find(z=>z.id===d.pname);if(!v){x.value=m?m.name:'';toast(t('needName'));return}if(m&&v!==m.name)save(()=>db.doc('products/'+d.pname).update({name:v}),t('nameUpd'))}
  if(d.pcost){const v=+x.value;if(v>=0)save(()=>db.doc('products/'+d.pcost).update({cost:v}),t('saved'))}
  if(d.ppid){const v=+x.value;if(v>=0)save(()=>db.doc('products/'+d.ppid).update({price:v}),t('priceUpd'))}
  if(d.sedit){const st=S.staffAll.find(z=>z.id===d.sid);if(!st)return;let v=x.value.trim();
    if(d.sedit==='name'&&!v){x.value=st.name;toast(t('needName'));return}
    if(d.sedit==='salary')v=Math.max(0,Math.round(+v||0));
    if(d.sedit==='payDay'){v=Math.min(31,Math.max(1,Math.round(+v||1)));x.value=v}
    if(d.sedit==='rate')v=Math.max(0,Math.round(+v||0));
    if((d.sedit==='shiftFrom'||d.sedit==='shiftTo')&&!v){x.value=d.sedit==='shiftFrom'?startOf(st):endOf(st);return}
    const upd={[d.sedit]:v};
    if(d.sedit==='shiftFrom'||d.sedit==='shiftTo'){const f=d.sedit==='shiftFrom'?v:startOf(st),e=d.sedit==='shiftTo'?v:endOf(st),hh=spanHours(f,e);if(!(hh>0)){toast(t('needHours'));x.value=d.sedit==='shiftFrom'?startOf(st):endOf(st);return}upd.shiftFrom=f;upd.shiftTo=e;upd.shiftH=hh}
    if(d.sedit==='payType'&&v==='day'&&!(+st.rate>0)&&+st.salary>0)upd.rate=Math.round(+st.salary/30);
    if(v!==(st[d.sedit]??'')||upd.shiftH)save(()=>db.doc('staff/'+d.sid).update(upd),t('saved'))}
  if(d.pid&&x.id.startsWith('ps_')){const v=Math.round(+x.value||0);save(()=>db.doc('products/'+d.pid).update({qty:v,counted:Date.now(),updatedAt:Date.now()}),t('stockSet'))}}
window.addEventListener('beforeunload',e=>{if(Object.keys(S.pend).length){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)A.modalNo();if(e.key==='Enter'&&(e.target.id==='mq'||e.target.classList.contains('nameinp')||!!e.target.dataset.sedit||e.target.classList.contains('qty')))e.target.blur();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('div[data-act]')){e.preventDefault();e.target.click()}});
setInterval(()=>{if(!S.draft&&!S.modal&&(S.tab==='tables'||S.tab==='credit'))render()},60000);

/* ---------- boot ---------- */
function applyTheme(){let th=null;try{th=localStorage.getItem('theme')}catch(e){}
  if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;else delete document.documentElement.dataset.theme;
  const dark=th==='dark'||(!th&&matchMedia('(prefers-color-scheme: dark)').matches);const b=$('#themeBtn');if(b){b.textContent=dark?'☀':'☾';b.title=dark?t('lightMode'):t('darkMode')}
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?'#0f3d22':'#14532d'}
applyTheme();document.documentElement.dataset.lang=LANG;
{const st=document.createElement('style');st.textContent=PRINT_CSS;document.head.appendChild(st)}
render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  S.booted=true;
  if(!db){S.connected=false;render();return}
  S.connected=true;
  try{const u=await window.claude.use('user');if(u){const c=u.can?await u.can('data.write'):null;S.readOnly=c===false;try{S.uid=u.id?await u.id():null}catch(e){}S.canEdit=!!(u.isOwner&&await u.isOwner());S.owner=S.canEdit;if(!S.canEdit){S.salesMode='day';S.day=clampDay(S.day)}}}catch(e){}
  subscribe();render();
  setTimeout(()=>{if(S.canEdit)sched(Array.from({length:14},(_,i)=>shift(today(),-i)))},4000);
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
